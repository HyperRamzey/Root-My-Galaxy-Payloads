name: Release payloads

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: payloads-release
  cancel-in-progress: false

jobs:
  build-native:
    name: Build ${{ matrix.target }} (sanity gate)
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        target:
          - f946b-F946BXXS7GZE5
          - e2s-S926BXXUEDZDR
          - essi-A566EXXSCCZG6
          - a36xq-A366WVLS3AYG1
    steps:
      - uses: actions/checkout@v4

      - name: Install Android NDK r30
        run: |
          set -e
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "ndk;30.0.15729638" > /dev/null || true
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/30.0.15729638" \
            >> "$GITHUB_ENV"

      - name: Build (source must still compile; output NOT shipped)
        run: |
          make TARGET=${{ matrix.target }} \
            ANDROID_NDK_HOME="$ANDROID_NDK_HOME" \
            NDK_HOST=linux-x86_64 API=35 all

  release:
    name: Publish release
    needs: [build-native]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # Ship the COMMITTED artifacts, byte-for-byte. These are the exact
      # binaries the live feed (support/targets-v3.json) points at and the
      # ones verified on-device. CI rebuilds are NOT byte-identical
      # (ThinLTO), so they must never be released: release == feed ==
      # verified bits. The build-native job above only gates that the
      # sources still compile. (The old weekly-refresh job silently
      # overwrote committed artifacts with CI rebuilds and is removed.)
      - name: Stage committed artifacts
        run: |
          set -euo pipefail
          mkdir -p dist
          for d in artifacts/*/; do
            t=$(basename "$d")
            mkdir -p "dist/$t"
            for f in cve-2026-43499-app.so cve-2026-43499-root \
                     cve-2026-43499; do
              [ -f "$d$f" ] && cp "$d$f" "dist/$t/$t-$f"
            done
          done
          find dist -type f | sort

      - name: Attach vendored KernelSU binaries + feed
        run: |
          mkdir -p dist/kernelsu dist/support
          cp kernelsu/*.ko kernelsu/ksud-* dist/kernelsu/ 2>/dev/null || true
          cp support/targets-v3.json support/targets-v2.json dist/support/

      - name: Generate checksums
        run: |
          cd dist
          find . -type f ! -name SHA256SUMS -exec sha256sum {} \; \
            > SHA256SUMS

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/**/*.so
            dist/**/*cve-2026-43499-root
            dist/**/*cve-2026-43499
            dist/kernelsu/*
            dist/support/*
            dist/SHA256SUMS
          generate_release_notes: true
